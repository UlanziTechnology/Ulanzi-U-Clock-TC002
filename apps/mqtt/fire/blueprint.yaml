# TC002 虚拟壁炉
# 当某个开关/布尔实体打开时，在 TC002 上点一炉火（循环火焰 GIF）；关闭时熄灭。

blueprint:
  name: TC002 虚拟壁炉
  description: |
    把 TC002 变成一炉桌面壁炉。监听一个开关/布尔实体：
    打开时发布循环火焰动画；关闭时发布熄灭（黑屏）帧。
    可接 input_boolean、switch，或"温度低于阈值"的模板实体（冷了就生火）。

    Author: cailurus  License: GPL-3.0-or-later
  domain: automation
  source_url: https://github.com/UlanziTechnology/Ulanzi-U-Clock-TC002/blob/main/apps/mqtt/fire/blueprint.yaml
  input:
    switch_entity:
      name: 开关实体
      description: 控制壁炉开/关的 HA 实体（input_boolean / switch 等）。
      selector:
        entity: {}
    on_value:
      name: "开"状态值
      default: "on"
      selector: { text: {} }
    custom_app_topic:
      name: TC002 Custom App MQTT topic
      default: ulanzi_1bf6/custom/fire
      selector: { text: {} }
    app_duration:
      name: 显示时长
      default: 3600
      selector:
        number: { min: 1, max: 86400, unit_of_measurement: s, mode: box }
    retain_message:
      name: 保留 MQTT 消息
      default: true
      selector: { boolean: {} }

mode: restart

trigger:
  - platform: state
    entity_id: !input switch_entity

variables:
  switch_entity_id: !input switch_entity
  duration: !input app_duration
  on_val: !input on_value
  current: "{{ states(switch_entity_id) | lower }}"
  fire_image: "data:image/gif;base64,"

action:
  - service: mqtt.publish
    data:
      topic: !input custom_app_topic
      retain: !input retain_message
      payload: >-
        {% if current == on_val | lower %}
        {
          "duration": {{ duration | int }},
          "text": [],
          "image": [{"data": "{{ fire_image }}", "position": [0, 0]}],
          "draw": []
        }
        {% else %}
        {
          "duration": {{ duration | int }},
          "text": [],
          "image": [],
          "draw": [{"df": [0, 0, 51, 15, "#000000"]}]
        }
        {% endif %}
