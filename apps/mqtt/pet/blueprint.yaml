# TC002 桌面像素宠物（灰猫）
# 通过 MQTT 发布 TC002 Custom App JSON payload，按 Home Assistant 实体状态切换宠物动作。
# 素材: Shepardskin "Cat Sprites" (CC0, https://opengameart.org/content/cat-sprites)，
#       已重上色为浅灰虎斑；CC0 与本仓库 GPL-3.0 兼容。

blueprint:
  name: TC002 桌面像素宠物
  description: |
    把 Ulanzi U-Clock TC002 变成一只桌面像素宠物（灰猫）。

    监听一个 Home Assistant 实体，按其状态切换宠物动作：
    idle: 站立（轻微呼吸）  walk: 散步  run: 奔跑
    例如把它接到「在家/活动/忙碌」这类状态，或任意 input_select。

    素材 Shepardskin (CC0)，已重上色。Author: 小熊猫  License: GPL-3.0-or-later
  domain: automation
  source_url: https://github.com/UlanziTechnology/Ulanzi-U-Clock-TC002/blob/main/apps/mqtt/pet/blueprint.yaml
  input:
    status_entity:
      name: 状态实体
      description: 提供当前状态的 HA 实体（例如 input_select）。
      selector:
        entity: {}
    custom_app_topic:
      name: TC002 Custom App MQTT topic
      description: 通常是 [PREFIX]/custom/[APP_NAME]，例如 ulanzi_1bf6/custom/pet。
      default: ulanzi_1bf6/custom/pet
      selector:
        text: {}
    app_duration:
      name: 显示时长
      description: 写入 payload 的 duration（秒）。
      default: 3600
      selector:
        number: { min: 1, max: 86400, unit_of_measurement: s, mode: box }
    retain_message:
      name: 保留 MQTT 消息
      default: true
      selector:
        boolean: {}
    idle_state:
      name: idle 状态值
      default: "idle"
      selector: { text: {} }
    walk_state:
      name: walk 状态值
      default: "walk"
      selector: { text: {} }
    run_state:
      name: run 状态值
      default: "run"
      selector: { text: {} }

mode: restart

trigger:
  - platform: state
    entity_id: !input status_entity

variables:
  status_entity_id: !input status_entity
  duration: !input app_duration
  idle_value: !input idle_state
  walk_value: !input walk_state
  run_value: !input run_state
  current_status: "{{ states(status_entity_id) | lower }}"
  idle_image: "data:image/gif;base64,"
  walk_image: "data:image/gif;base64,"
  run_image: "data:image/gif;base64,"

action:
  - service: mqtt.publish
    data:
      topic: !input custom_app_topic
      retain: !input retain_message
      payload: >-
        {% set image = idle_image %}
        {% if current_status == walk_value | lower %}
          {% set image = walk_image %}
        {% elif current_status == run_value | lower %}
          {% set image = run_image %}
        {% endif %}
        {
          "duration": {{ duration | int }},
          "text": [],
          "image": [{"data": "{{ image }}", "position": [0, 0]}],
          "draw": []
        }
