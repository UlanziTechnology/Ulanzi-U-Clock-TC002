<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TC002 小红书粉丝数设置</title>
    <style>
      body { font: 14px system-ui; max-width: 680px; margin: 32px auto; padding: 0 20px; color: #202124; }
      label { display: block; font-weight: 600; margin-top: 18px; }
      input { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 9px; }
      button { margin-top: 20px; padding: 9px 18px; }
      .binding { display: grid; grid-template-columns: 180px 1fr auto; gap: 10px; align-items: end; margin-top: 12px; }
      .binding label { margin-top: 0; }
      .binding button { margin: 0 0 1px; }
      #addBinding { margin-top: 12px; }
      #status { margin-left: 12px; }
      .hint { color: #5f6368; font-size: 12px; }
      .warning { color: #b06000; }
      @media (max-width: 620px) { .binding { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <h1>TC002 小红书粉丝数</h1>
    <p>这些设置只保存在当前电脑的 Chrome 中。页面数据只会发送到本机 127.0.0.1，不会上传到第三方服务。</p>

    <h2>设备与主页绑定</h2>
    <p class="hint">每台 TC002 绑定一个小红书主页。请填写 TC002 设备 IP；设备和电脑需能通过同一局域网互相访问。</p>
    <div id="bindings"></div>
    <button id="addBinding" type="button">添加设备</button>
    <p id="bindingWarning" class="hint warning"></p>

    <label for="refreshSeconds">刷新间隔（秒，最少 5）</label>
    <input id="refreshSeconds" type="number" min="5" step="1" value="30">
    <p class="hint">5 秒仅建议短期联调；长期运行建议设置为 60 秒以上，以降低登录验证和访问限流风险。</p>

    <label for="bridgeUrl">本地桥接地址</label>
    <input id="bridgeUrl" type="url" value="http://127.0.0.1:17321">
    <p class="hint">默认端口为 17321；如当前电脑上的 Bridge 使用其他端口，请在这里修改。</p>

    <label for="bridgeToken">共享令牌</label>
    <input id="bridgeToken" type="password" autocomplete="off">
    <p class="hint">必须与当前电脑启动 Bridge 时设置的 XHS_BRIDGE_TOKEN 完全一致。</p>

    <button id="save" type="button">保存</button><span id="status"></span>
    <pre id="lastResult"></pre>
    <script type="module" src="options.js"></script>
  </body>
</html>
